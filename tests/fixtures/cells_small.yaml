# 테스트 전용 — configs/cells/default.yaml 에서 쿼터만 줄인 사본.
# fixture 200건으로는 셀당 25~40명을 채울 수 없어 쿼터 로직 자체를 검증하지 못한다.
# 쿼터 외 축·필터 정의는 프로덕션 설정과 동일해야 한다 (test_sampling_config.py가 검사).
# 셀 설계 — PROJECT-BRIEF.md §5.1 1·3단계
# 데이터셋의 변수 간 독립성 가정(§2.4) 때문에 셀은 굵게 유지한다. 3×2×2 = 12셀.
#
# ⚠️ 실측 정정 (DuckDB 원격 조회, train-00000 111,112행 기준)
# 브리프가 가정한 family_type 4종은 실제 데이터와 다르다. 실제 값은 39종이고,
# 브리프가 적은 `3세대 이상`·`부모와 거주`는 **데이터에 존재하지 않는다.**
# 실제 표기는 `기타3세대`·`부모와 동거`이며, 1인 가구는 `1인 가구`가 아니라 `혼자 거주`다.
# 리터럴 열거로는 30~69세 대상의 56.7%만 잡고 나머지를 조용히 버린다.
# → 리터럴 대신 **부분문자열 패턴(match_any)** 으로 판정한다.

hard_filter:
  age: { min: 30, max: 69 }

  # 가구 안에 다른 가족 구성원이 있는 사람. 39종 실측값을 관계어로 덮는다.
  # (배우자·자녀와 거주 36.2% / 배우자와 거주 20.5% / 부모와 동거 4.4% /
  #  자녀와 거주(한부모) 3.9% / 기타2세대 3.6% / 어머니와 동거 3.0% / 기타3세대 2.5% …)
  family_type:
    match_any:
      - 배우자
      - 자녀
      - 부모
      - 어머니
      - 아버지
      - 조부
      - 조모
      - 형제자매
      - 친인척
      - 세대
    # 비친족 동거(1.2%)는 가족 식사 맥락이 아니므로 제외.
    # '비친족'이 '친인척' 패턴에 걸리는 문제도 여기서 함께 차단된다.
    exclude_any:
      - 비친족

  # 1인 가구는 가족 동거 패턴에 걸리지 않지만, 혼밥 프리미엄 수요 검증용으로
  # 통과시켜 별도 소수 셀(자녀비동거)로 보낸다. 실측 표기는 `혼자 거주`이며
  # `혼자 거주 (배우자 별거)` 변형도 부분문자열로 함께 잡힌다.
  single_household:
    match_any:
      - 혼자 거주
    keep_as_cell: true

axes:
  age:
    "30-44": { min: 30, max: 44 }
    "45-59": { min: 45, max: 59 }
    "60-69": { min: 60, max: 69 }

  region:
    수도권: [서울, 경기, 인천]
    비수도권: "*" # 나머지 14개 시도 전부

  # 축의 의미는 '가구 내 자녀 유무' — 갈비찜 수요를 가르는 변수가 그것이다.
  # 브리프의 `자녀동거 / 부부또는1인` 중 후자는 `부모와 동거`·`어머니와 동거`처럼
  # 부부도 1인도 아닌 실측값 다수를 담지 못해 이름이 사실과 어긋난다. → `자녀비동거`.
  household:
    자녀동거:
      match_any:
        - 자녀 # 배우자·자녀와 거주, 자녀와 거주(한부모), 배우자·자녀·부모와 거주 …
        - 3세대 # 기타3세대
        - 4세대 # 4세대이상
    자녀비동거: "*" # 배우자와 거주, 혼자 거주, 부모와 동거, 기타2세대 …

quota:
  survey: { min: 2, max: 3 } # 셀당 → 총 300~480명
  idi: { min: 1, max: 1 } # 셀당 → 총 12~24명

# 셀 가중치는 KREI 식품소비행태조사(2024) 실제 분포로 사후 보정 — sampling/weights.py 훅.
# 기준 분포표가 아직 없어 현재는 전 셀 weight=1.0(미보정)이며, 그 사실을 숨기지 않는다.
weight_source: krei-food-2024
