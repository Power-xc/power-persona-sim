[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "power-persona-sim"
version = "0.1.0"
description = "NVIDIA Nemotron Personas Korea 기반 소비자 조사 시뮬레이터 — 통계 정합 합성 페르소나를 선별해 설문·심층인터뷰를 대신 돌린다"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "pyyaml>=6",
    "jinja2>=3.1",
    "scipy>=1.14",
]

[project.optional-dependencies]
hf = ["datasets>=3.0", "huggingface_hub[hf_transfer]>=0.26"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
power-persona-sim = "power_persona_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/power_persona_sim"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
