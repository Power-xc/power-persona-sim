# 청와연 靑瓦宴 — 심층 인터뷰 가이드 (브리프 §4.3b)
# JTBD 스위치 인터뷰 구조. 브랜드는 20분 지점에서 처음 꺼낸다 —
# 그 전에 노출하면 이후 모든 회상이 브랜드에 오염된다.

id: cheongwayeon-idi-v1
duration_min: 60

principles:
  - 이유를 묻지 말고 사건을 물어라. "왜 안 사세요"는 합리화된 답을 부르고,
    "안 사고 무엇을 사셨나요, 그때 어떻게 정하셨어요"는 행동을 부른다.
  - LLM 페르소나 상대로는 이 원칙이 더 중요하다. 모델은 "왜" 질문에
    그럴듯한 서사를 지어내는 경향이 강하다.
  - 추상적 선호가 나오면 반드시 마지막 실제 사건으로 되돌린다.
  - 침묵을 견딘다. 진행자가 채우면 응답자의 회상이 끊긴다.
  - 자극물은 정해진 시점에만 제시한다. 미리 보여주면 가격 문항이 무의미해진다.

blocks:
  - t_start_min: 0
    t_end_min: 5
    knowledge_ids: []
    script: >-
      라포 형성. 최근 집에서 어떤 식사를 준비하셨는지 편하게 여쭙는다.
      브랜드도 카테고리도 아직 꺼내지 않는다.
    probes:
      - 요즘 저녁 식사는 주로 어떻게 해결하시나요?
      - 그중에 손이 많이 가는 메뉴가 있다면 어떤 건가요?

  - t_start_min: 5
    t_end_min: 20
    knowledge_ids: [K1, K2]
    script: >-
      최근 구매 타임라인 역추적. "마지막으로 갈비찜을 산 날로 돌아가 봅시다.
      그날 아침부터 순서대로요."
    probes:
      - 언제 처음 '사야겠다'는 생각이 드셨나요? 그 순간 무슨 일이 있었죠?
      - 그 전에 다른 것도 생각하셨나요? 왜 이걸로 정하셨어요?
      - 어디서, 무엇을 보고 최종적으로 정하셨나요?
      - 직접 만드는 선택지는 언제 접으셨나요? 그때 무슨 생각을 하셨죠?
      - 그날 함께 먹은 사람은 누구였고, 반응은 어땠나요?

  - t_start_min: 20
    t_end_min: 35
    knowledge_ids: [K3, K4, K5]
    script: >-
      브랜드 진입. 비보조 상기를 먼저 받고 나서 청와연을 처음 제시한다.
      속성이 나오면 래더링 3단으로 가치까지 내려간다.
    probes:
      - 갈비찜 브랜드 중 떠오르는 이름을 다 말씀해주세요.
      - (청와연 제시) 들어보신 적 있나요? 어디서요?
      - 이름을 들으니 어떤 느낌이 드시나요? 왜 그렇게 느끼셨어요?
      - 그게 왜 중요한가요? — 속성에서 편익으로
      - 그러면 어떤 점이 좋아지죠? — 편익에서 가치로
      - 지난번 살 때 이 브랜드가 후보에 있었나요? 없었다면 어느 단계에서 빠졌죠?

  - t_start_min: 35
    t_end_min: 48
    knowledge_ids: [K6, K7, K8]
    script: >-
      장벽 확인. 가격 자극물을 이 지점에서 처음 제시한다.
      실패 경험은 사건으로 받아 적는다.
    probes:
      - 이 가격표를 보시면 어떤 생각이 드나요?
      - 비싸다면, 얼마면 '그럴 만하다'고 느끼실까요? 그 차이는 무엇이 채워야 하나요?
      - 평소 장 보시는 곳에서 이 제품을 보신 적 있나요? 찾아보신 적은요?
      - 샀다가 실망한 적 있나요? 그때 무슨 일이 있었죠?
      - 그 일 이후로 고르는 방식이 달라진 게 있나요?

  - t_start_min: 48
    t_end_min: 58
    knowledge_ids: [K9]
    script: >-
      전환 조건. 반사실을 장면으로 상상하게 한 뒤 조건을 하나씩 던져 확인한다.
    probes:
      - 다음번에 이걸 장바구니에 넣는 장면을 상상해보세요.
        그렇게 되려면 지금과 무엇이 달라져 있어야 할까요?
      - 만약 소용량 구성이 나온다면 사시겠어요? 왜요? 왜 아니죠?
      - 만약 늘 가시는 그 매장에 있다면요?
      - 방금 말씀하신 조건 중에 하나만 고른다면 어느 쪽인가요?

  - t_start_min: 58
    t_end_min: 60
    knowledge_ids: []
    script: 마무리. 진행자가 놓친 것을 응답자에게 되묻는다.
    probes:
      - 제가 여쭙지 않았는데 중요하다고 생각되시는 게 있나요?
