# 청와연 靑瓦宴 — 사전 등록 가설 (브리프 §7.2)
# 예측을 실행 전에 못 박아 둔다. 결과를 보고 나서 해석을 고르면
# 브리프 §6.1의 "분석 자유도" 실패 모드에 그대로 걸린다.

hypotheses:
  - id: H1
    name: 격식 프레임 가설
    statement: >-
      「청와연 靑瓦宴」은 한자 세 글자와 기와, 잔치라는 기호 때문에 명절·격식
      전용이라는 인상을 강하게 준다. 그래서 갈비찜 구매자 중 일상 수요층은
      이 브랜드를 애초에 후보군에 넣지 않는다. 비구매의 원인이 제품이 아니라
      이름과 톤에서 이미 발생한다는 뜻이다.
    knowledge_ids: [K1, K4]
    question_ids: [A1, A2, B5, B6, E3]
    predictions:
      - segment: A1에서 명절 상차림·손님 접대를 고른 응답자
        expect: B6이 격식 쪽으로 기울고, B5에서 과한 느낌 사유를 거의 고르지 않는다
      - segment: A1에서 평일 저녁 반찬·나를 위한 보상 한 끼를 고른 응답자
        expect: B6이 격식 쪽으로 더 강하게 기울고, B5에서 우리 집 식사에는 과한 느낌이라서를 상위로 고른다
      - segment: 두 세그먼트의 B6 격차
        expect: 격차가 크면 H1 지지. 두 세그먼트가 비슷하면 H1 기각
      - segment: E3 상위 조건의 세그먼트별 구성
        expect: H1이 참이면 일상 트리거 세그먼트에서 평일 식사에도 어울리는 제안이 상위로 올라온다
    prescription_if_supported: >-
      제품 개선이 아니라 서브 라인 분리로 간다 — 청와연 상차림(격식) /
      청와연 한끼(일상). 레버 우선순위는 L5 메시지·패키지가 1순위.
    prescription_if_rejected: >-
      원인은 이름이 아니라 도달이나 유통 쪽이다. K3(인지)·K7(채널)을 먼저 보고
      L1 인지·도달과 L4 유통 채널로 예산을 돌린다.

  - id: H2
    name: 채널 부재 가설
    statement: >-
      비구매의 상당 부분이 태도가 아니라 접점 부재에서 온다. 주 구매 채널에서
      청와연을 본 적이 없는 응답자는 브랜드에 대한 부정적 연상이 없는데도
      후보군에 넣지 못한다.
    knowledge_ids: [K3, K7]
    question_ids: [A6, B2, B5, B7]
    predictions:
      - segment: B7에서 본 적 없다를 고른 응답자
        expect: B5에서 내가 사는 곳에서 팔지 않아서가 상위로 올라온다
      - segment: B2에서 청와연을 인지하면서 B7은 본 적 없다인 응답자
        expect: 이 조합의 비중이 크면 문제는 태도가 아니라 유통이다
    prescription_if_supported: L4 유통 채널을 1순위 레버로 올리고 A6 상위 채널부터 입점 순서를 잡는다
    prescription_if_rejected: 접점은 이미 있으므로 원인은 제안 쪽이다. K4·K5로 되돌아간다
