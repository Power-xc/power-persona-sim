# 청와연 靑瓦宴 — GOAL (브리프 §4.1)
# 목적을 "의사결정"까지 내린다. "신규 고객 증대"에서 멈추면 문항이 나오지 않는다.

business_goal: 갈비찜 완제품 구매자 중 청와연 비구매자를 구매자로 전환한다

decision: >-
  전환 예산을 다섯 레버 중 어디에 얼마나 투입할 것인가 —
  인지·도달 / 제품 사양 / 가격·프로모션 / 유통 채널 / 메시지·패키지

success_criteria: >-
  다섯 레버에 우선순위와 근거가 붙고, 레버별로 다음 인간 조사에서 검증 가능한
  전환 가설이 최소 하나씩 도출된다

one_sentence: >-
  갈비찜을 사는 사람이 청와연을 안 사는 이유는 [___]이며,
  [___]를 바꾸면 [___] 세그먼트가 전환된다

levers:
  - id: L1
    name: 인지·도달
  - id: L2
    name: 제품 사양
  - id: L3
    name: 가격·프로모션
  - id: L4
    name: 유통 채널
  - id: L5
    name: 메시지·패키지

# 대상 정의. 지금은 계약에 자리가 없어 문서로만 싣고, 실제 걸러내는 일은
# survey.yaml 섹션 S의 terminate_on 규칙이 한다.
screening:
  include:
    - 최근 12개월 내 갈비찜 완제품(밀키트·간편식·선물세트) 구매 경험 있음
    - 청와연 구매 경험 없음
    - 본인이 구매를 결정하거나 공동 결정함
  segments:
    - id: unaware
      label: 미인지
      definition: 보조 인지에서도 청와연을 고르지 않음
    - id: aware_not_considered
      label: 인지·미고려
      definition: 청와연을 알지만 최근 구매 시 후보군에 넣지 않음
    - id: considered_not_bought
      label: 고려·미구매
      definition: 후보군에 넣었으나 다른 것을 선택함
  exclude:
    - 카테고리 비구매자 — 수요 창출은 별건 조사
    - 청와연 구매 경험자 — 이탈·재구매는 별건 조사
