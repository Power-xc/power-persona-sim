# 셀 설계 — 업무용 소프트웨어 조사판 (default.yaml의 교체본)
#
# 식품 케이스의 셀 축(연령×지역×가구)은 "누가 갈비찜을 사는가"를 가르는 변수였다.
# 업무 도구는 가구 구성이 채택을 가르지 않는다. 그래서 가구 축은 단일 수준으로
# 접고, 표본을 실제로 가르는 일은 2단계 신호 점수(직무 서사)가 한다.
#
# 축을 접되 없애지 않는 이유: 엔진이 3축(연령·지역·가구)을 전제로 셀 ID를 만든다.
# 억지로 의미를 부여한 가구 축을 만들면 없는 교호작용을 읽게 되므로, 단일 수준
# `전체`로 두어 "이 축은 이 조사에서 변수가 아니다"를 설정 파일에 명시한다.

hard_filter:
  # 경제활동인구 중심. 25세 미만은 직무 서사가 얕고, 60세 이상은 사내 데이터 도구
  # 도입 대상에서 실질적으로 벗어난다.
  age: { min: 25, max: 59 }

  # 가구 형태는 이 조사의 배제 조건이 아니다 — 전부 통과시킨다.
  family_type: "*"

axes:
  age:
    "25-34": { min: 25, max: 34 }
    "35-44": { min: 35, max: 44 }
    "45-59": { min: 45, max: 59 }

  # 수도권 집중은 사내 데이터 인프라 성숙도와 상관이 있다고 보고 남긴 축이다.
  region:
    수도권: [서울, 경기, 인천]
    비수도권: "*"

  household:
    전체: "*" # 이 조사에서 가구 구성은 변수가 아니다 (위 주석)

quota:
  survey: { min: 3, max: 6 } # 셀당 → 6셀 × 6 = 최대 36명
  idi: { min: 1, max: 1 } # 셀당 1명 → 6명

# 이 카테고리의 셀 분포를 대조할 공식 통계 기준값이 아직 없다.
# 있는 척하지 않고 미보정(weight=1.0)임을 여기에 남긴다.
weight_source: none
