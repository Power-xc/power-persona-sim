# 셀 설계 — PROJECT-BRIEF.md §5.1 1·3단계
# 데이터셋의 변수 간 독립성 가정(§2.4) 때문에 셀은 굵게 유지한다. 3×2×2 = 12셀.

hard_filter:
  age: { min: 30, max: 69 }
  family_type_in:
    - 배우자·자녀와 거주
    - 배우자와 거주
    - 3세대 이상
    - 부모와 거주
  # 1인가구는 하드 필터에서 제외하되 별도 소수 셀로 유지 (혼밥 프리미엄 수요 검증)
  keep_single_household_cell: true

axes:
  age:
    "30-44": { min: 30, max: 44 }
    "45-59": { min: 45, max: 59 }
    "60-69": { min: 60, max: 69 }
  region:
    수도권: [서울, 경기, 인천]
    비수도권: "*"          # 나머지 전부
  household:
    자녀동거: [배우자·자녀와 거주, 3세대 이상]
    부부또는1인: [배우자와 거주, 1인 가구]

quota:
  survey: { min: 25, max: 40 }   # 셀당 → 총 300~480명
  idi: { min: 1, max: 2 }        # 셀당 → 총 12~24명

# 셀 가중치는 KREI 식품소비행태조사(2024) 실제 분포로 사후 보정 — sampling 모듈이 채운다
weight_source: krei-food-2024
