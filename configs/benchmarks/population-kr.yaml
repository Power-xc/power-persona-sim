      source_url: "https://jumin.mois.go.kr/"
      year: 2025
      confidence: official
      note: "Ministry of Interior and Safety registration population statistics, 5-year age groups aggregated"

  region:
    # Region distribution (Korea-wide)
    수도권:  # Seoul, Gyeonggi, Incheon
      proportion: 0.495
      source_url: "https://kosis.kr/"
      year: 2025
      confidence: official
      note: "Seoul metropolitan area (서울+경기+인천) population proportion"
    비수도권:
      proportion: 0.505
      source_url: "https://kosis.kr/"
      year: 2025
      confidence: official
      note: "Non-metropolitan regions (전국 - 수도권)"

  family_type:
    # Family structure (has minor children vs. no minor children / single)
    자녀동거:
      proportion: 0.420
      source_url: null
      year: null
      confidence: null
      note: "Cohabiting with minor children — exact proportion for 30-69 age group not publicly available; estimated from census microdata"
    자녀비동거:
      proportion: 0.580
      source_url: null
      year: null
      confidence: null
      note: "Not cohabiting with minor children (couples only, or single) — estimated as complement; requires KOSIS/census access for direct measurement"

