# Population Benchmark — Korean Demographics (30-69 age)
#
# Schema:
#   cells: dict of benchmark cells (key: "age=X-Y|region=Z|family=W")
#   marginal_dist: dict of marginal distributions by axis
#   metadata: source, year, confidence level
#
# Confidence levels: official (통계청/정부), industry (협회/기관), press (보도자료)
# All cell proportions must sum to 1.0 within rounding error.
# Missing values marked as `null` with explanatory `note`.

metadata:
  title: "Population distribution (30-69 age) by age group, region, family status"
  source_org: "KOSIS (Korean Statistical Information Service) / Statistics Korea"
  source_url: "https://kosis.kr/visual/populationKorea/PopulationDashBoardMain.do"
  year: 2025
  confidence: official
  updated_date: "2026-07-28"
  note: "Data sourced from KOSIS population dashboard; specific cell-level breakdown obtained from public data portal"

# Marginal distributions — sum to 1.0
marginal_dist:
  age_groups:
    # Age distribution (30-69 age subset)
    "30-44":
      proportion: 0.332
      source_url: "https://jumin.mois.go.kr/"
      year: 2025
      confidence: official
      note: "Ministry of Interior and Safety registration population statistics, 5-year age groups aggregated"
    "45-59":
      proportion: 0.391
      source_url: "https://jumin.mois.go.kr/"
      year: 2025
      confidence: official
      note: "Ministry of Interior and Safety registration population statistics, 5-year age groups aggregated"
    "60-69":
