    confidence: official

_data_quality:
  note: "KREI food consumption survey is official government-funded research with rotating panel methodology since 2023. Channel proportions and HMR frequency data directly sourced. Dining frequency and age-stratified channel preference require additional table extraction from full statistical report."
  validation_methods: "Cross-check channel data against retail POS aggregates from FIS (aT); validate convenience food frequency against industry scanner data"
  next_steps: "Obtain full PDF statistical tables to extract age-cohort stratification by purchase channel"
