# 갈비찜(식품) 카테고리 신호 사전 — PROJECT-BRIEF.md §5.1 2단계
# 카테고리를 바꾸면 이 파일만 교체한다 (beauty.yaml, …).
#
# 매칭은 부분문자열이다. 짧은 한 글자 키워드는 엉뚱한 단어를 삼키므로 쓰지 않는다.
# 실측: 브리프의 `국` 한 글자는 fixture 200건에서 56회 걸렸는데 그중 국물요리는
# 9회뿐이고 41회가 `청국장`, 나머지가 `중국`·`태국`·`영국`·`전국`처럼 무관한 단어였다.
# → 국물요리는 명시적 어휘로 풀어 쓰고, 청국장은 한식 어휘로 따로 넣는다.
